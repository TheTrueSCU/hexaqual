[project]
name = "hexaqual"
version = "0.4.1"
description = "Universal Python quality gates, architectural boundary enforcement, and release engineering toolchain."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "complexipy>=7.0.1",
    "coverage>=7.6.0",
    "deptry>=0.23.0",
    "hexaflow>=0.3.0",
    "httpx>=0.28.0",
    "import-linter>=2.13",
    "inline-snapshot>=0.35.4",
    "libcst>=1.9.0",
    "pydantic>=2.10.0",
    "pytest-archon>=0.0.7",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
diagrams = [
    "pydeps>=3.0.7",
]
mutmut = [
    "mutmut<3",
]
rope = [
    "rope>=1.14.0",
]
all = [
    "hexaqual[diagrams,mutmut,rope]",
]

[project.urls]
Homepage = "https://github.com/TheTrueSCU/hexaqual"
Repository = "https://github.com/TheTrueSCU/hexaqual"
Documentation = "https://dopplereffect.us/hexaqual/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.75",
    "zensical>=0.0.59",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"
]
ignore = ["E501", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/hexaqual/cli/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["hexaqual"]

[project.scripts]
hexaqual = "hexaqual.cli.main:app"

[tool.importlinter]
root_packages = ["hexaqual"]

[[tool.importlinter.contracts]]
name = "Hexagonal architecture layer hierarchy"
type = "layers"
containers = ["hexaqual"]
layers = [
    "infra",
    "adapters",
    "ports",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for domain"
type = "forbidden"
source_modules = ["hexaqual.domain"]
forbidden_modules = [
    "hexaqual.ports",
    "hexaqual.adapters",
    "hexaqual.infra",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for ports"
type = "forbidden"
source_modules = ["hexaqual.ports"]
forbidden_modules = [
    "hexaqual.adapters",
    "hexaqual.infra",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for adapters"
type = "forbidden"
source_modules = ["hexaqual.adapters"]
forbidden_modules = [
    "hexaqual.infra",
]

[[tool.importlinter.contracts]]
name = "Forbidden imports for utils"
type = "forbidden"
source_modules = ["hexaqual.utils"]
forbidden_modules = [
    "hexaqual.domain",
    "hexaqual.ports",
    "hexaqual.adapters",
]

[tool.coverage.run]
source = ["src/hexaqual"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
    "return NotImplemented",
]
