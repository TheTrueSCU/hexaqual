- id: hexaqual-sanity
  name: hexaqual sanity check
  description: Fast scoped sanity check runner (Ruff, Ty, Complexipy, __all__, test parity, deptry)
  entry: uv run hexaqual sanity -a --skip-tests
  language: system
  pass_filenames: false

- id: hexaqual-architecture
  name: hexaqual architecture parity
  description: Verify test_hexagonal_boundaries.py architectural test suites across packages
  entry: uv run hexaqual parity architecture
  language: system
  pass_filenames: false

- id: hexaqual-test-parity
  name: hexaqual test parity
  description: Verify 1:1 structural symmetry between src/ and tests/unit/
  entry: uv run hexaqual parity test
  language: system
  pass_filenames: false

- id: hexaqual-statements
  name: hexaqual statement integrity
  description: Validate sorted and deduplicated __all__ export lists
  entry: uv run hexaqual statements check
  language: system
  pass_filenames: false

- id: hexaqual-linter
  name: hexaqual hexagonal import boundaries
  description: Validate hexagonal package import boundaries via import-linter
  entry: uv run hexaqual deps linter
  language: system
  files: ^packages/.*(\.py|pyproject\.toml)$
  pass_filenames: true

- id: hexaqual-extras
  name: hexaqual extras parity
  description: Verify optional extras forwarding across workspace packages
  entry: uv run hexaqual parity extras
  language: system
  files: ^(packages/.*/pyproject\.toml|pyproject\.toml)$
  pass_filenames: false

- id: hexaqual-usage-docs
  name: hexaqual usage docs integrity
  description: Ensure CLI USAGE.md documentation matches Typer entrypoints
  entry: uv run hexaqual docs usage --check
  language: system
  files: ^packages/.*$
  pass_filenames: false

- id: hexaqual-docs-links
  name: hexaqual doc link integrity
  description: Ensure relative links and anchors within documentation trees are valid
  entry: uv run hexaqual docs links
  language: system
  files: \.(md|rst)$
  pass_filenames: false

- id: hexaqual-diagrams
  name: hexaqual architecture diagrams
  description: Verify architecture dependency SVG diagrams are fresh and up to date
  entry: uv run hexaqual deps pydeps --check
  language: system
  files: ^packages/.*\.py$
  pass_filenames: false

- id: hexaqual-agents
  name: hexaqual agent assets integrity
  description: Ensure shared .agents rules, workflows, and skills are in sync with hexaqual
  entry: uv run hexaqual agents check
  language: system
  files: ^(\.agents/|pyproject\.toml|uv\.lock)$
  pass_filenames: false

- id: hexaqual-agents-sync
  name: hexaqual agent assets auto-sync
  description: Automatically re-synchronize shared .agents rules, workflows, and skills after pull/merge/checkout
  entry: uv run hexaqual agents sync
  language: system
  stages: [post-merge, post-checkout]
  always_run: true
  pass_filenames: false

- id: hexaqual-commit-msg
  name: hexaqual commit message integrity
  description: Validate Conventional Commits format and OpenSSF DCO sign-off trailer
  entry: uv run hexaqual hooks commit-msg
  language: system
  stages: [commit-msg]
  pass_filenames: true

- id: hexaqual-pre-push
  name: hexaqual pre-push sanity gate
  description: Fast repository sanity validation before pushing commits to remote
  entry: uv run hexaqual sanity -a --skip-tests
  language: system
  stages: [pre-push]
  always_run: true
  pass_filenames: false

- id: hexaqual-openssf-check
  name: hexaqual openssf badge check
  description: Verify OpenSSF Best Practices badge compliance against required tier
  entry: uv run hexaqual openssf check
  language: system
  pass_filenames: false
