name: "Hexaqual LPT Mutation Matrix Planner"
description: "Plans AST-weighted, capacity-capped Longest-Processing-Time-first (LPT) mutation matrices via 'hexaqual mutate plan'."

inputs:
  mode:
    description: "Planning mode: 'affected', 'all', 'slices', or 'changed-slices' (LPT buckets of PR-changed files)"
    required: false
    default: "affected"
  base-ref:
    description: "Base branch name for 'affected' / 'changed-slices' modes"
    required: false
    default: ""
  packages-root:
    description: "Workspace packages directory for 'affected' / 'all' / 'changed-slices' modes"
    required: false
    default: "packages"
  root:
    description: "Source directory to partition for 'slices' / single-package 'changed-slices' modes"
    required: false
    default: "src"
  slices:
    description: "Maximum number of parallel slices for slice-based modes"
    required: false
    default: "12"
  max-weight:
    description: "Per-slice AST mutation weight cap (isolates heavy files; 0 disables dynamic capping)"
    required: false
    default: "450"

outputs:
  matrix:
    description: "JSON matrix payload for GitHub Actions strategy.matrix"
    value: ${{ steps.plan.outputs.matrix }}
  has_affected:
    description: "Whether at least one package or slice was planned ('true' / 'false')"
    value: ${{ steps.plan.outputs.has_affected }}

runs:
  using: "composite"
  steps:
    - name: Plan LPT Mutation Matrix
      id: plan
      shell: bash
      env:
        PLAN_MODE: ${{ inputs.mode }}
        PLAN_BASE_REF: ${{ inputs.base-ref }}
        PLAN_PACKAGES_ROOT: ${{ inputs.packages-root }}
        PLAN_ROOT: ${{ inputs.root }}
        PLAN_SLICES: ${{ inputs.slices }}
        PLAN_MAX_WEIGHT: ${{ inputs.max-weight }}
      run: |
        BASE_REF="${PLAN_BASE_REF:-${GITHUB_BASE_REF:-main}}"
        ARGS=(
          mutate plan
          --mode "$PLAN_MODE"
          --base-ref "$BASE_REF"
          --packages-root "$PLAN_PACKAGES_ROOT"
          --root "$PLAN_ROOT"
          --slices "$PLAN_SLICES"
          --max-weight "$PLAN_MAX_WEIGHT"
          --github-output
        )
        if command -v hexaqual >/dev/null 2>&1; then
          hexaqual "${ARGS[@]}"
        elif command -v uv >/dev/null 2>&1; then
          uvx --from "${{ github.action_path }}/../../.." hexaqual "${ARGS[@]}"
        else
          python3 "${{ github.action_path }}/fallback.py" \
            --mode "$PLAN_MODE" \
            --base-ref "$BASE_REF" \
            --packages-root "$PLAN_PACKAGES_ROOT" \
            --root "$PLAN_ROOT" \
            --slices "$PLAN_SLICES" \
            --max-weight "$PLAN_MAX_WEIGHT"
        fi
