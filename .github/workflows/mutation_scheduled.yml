name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit:
    name: Mutation Audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: domain-ports
            targets: src/hexaqual/domain,src/hexaqual/ports
          - name: cli
            targets: src/hexaqual/cli
          - name: infra
            targets: src/hexaqual/infra
          - name: adapters-core
            targets: src/hexaqual/adapters/runners,src/hexaqual/adapters/testing,src/hexaqual/adapters/github,src/hexaqual/adapters/pypi,src/hexaqual/adapters/hooks
          - name: adapters-analysis
            targets: src/hexaqual/adapters/code_analysis,src/hexaqual/adapters/generators,src/hexaqual/adapters/publishers,src/hexaqual/adapters/dependencies
          - name: adapters-root
            targets: src/hexaqual/adapters/workspace.py,src/hexaqual/adapters/openssf.py
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Execute Mutation Sweep
        run: |
          uv run pytest --rootdir=. -o addopts= --cov=src --cov-fail-under=0 --gremlins \
            --gremlin-targets="${{ matrix.targets }}" \
            --gremlin-workers=auto --gremlin-batch-size=10 --gremlin-batch \
            --gremlin-mutant-timeout=30 --gremlin-cache \
            -m "not demo and not e2e and not integration" -n auto \
            --gremlin-report=json,console tests/unit

      - name: Generate Mutation Triage Summary
        if: always()
        run: |
          uv run hexaqual mutate inspect -s -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: mutation-audit-report-${{ matrix.name }}
          path: |
            .gremlins-cache/
            .mutmut-cache
          retention-days: 14
