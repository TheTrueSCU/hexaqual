name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-slices:
    name: Discover Mutation Slices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Build Dynamic Slice Matrix
        id: discover
        uses: ./.github/actions/mutate-plan
        with:
          mode: slices
          root: src/hexaqual
          slices: "16"

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

  mutation-audit:
    name: Mutation Audit (${{ matrix.name }})
    needs: discover-slices
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-slices.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Execute Mutation Sweep
        run: |
          unset GITHUB_STEP_SUMMARY
          uv run pytest --rootdir=. -o addopts= --gremlins \
            --gremlin-targets="${{ matrix.targets }}" \
            --gremlin-workers=auto --gremlin-batch-size=10 --gremlin-batch \
            --gremlin-mutant-timeout=30 --gremlin-cache \
            -m "not demo and not e2e and not integration" \
            --gremlin-report=json,console tests/unit

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: mutation-audit-report-${{ matrix.name }}
          path: |
            coverage/gremlins/
            .gremlins_cache/
          if-no-files-found: ignore
          retention-days: 14

  audit-success:
    name: Mutation Audit Success (All Slices)
    needs:
      - discover-slices
      - mutation-audit
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Slice Artifacts & Emit Consolidated Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          if gh run download "${{ github.run_id }}" --pattern "mutation-audit-report-*" --dir artifacts; then
            echo "Downloaded slice artifacts successfully."
          else
            dl_rc=$?
            echo "::warning::gh run download exited with code $dl_rc while fetching mutation-audit-report-* artifacts."
          fi

          report_count=$(find artifacts -name 'gremlins.json' | wc -l | tr -d ' ')
          echo "Discovered $report_count gremlins.json report file(s) under artifacts/."

          python3 .github/scripts/aggregate_mutation_summary.py artifacts \
            --status-discover "${{ needs.discover-slices.result }}" \
            --status-audit "${{ needs.mutation-audit.result }}" \
            --output mutation-summary.md \
            --step-summary

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "Step summary written ($(wc -c < "$GITHUB_STEP_SUMMARY" | tr -d ' ') bytes)."
          else
            echo "::warning::GITHUB_STEP_SUMMARY is unset or empty after aggregation."
          fi

      - name: Upload Consolidated Mutation Summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: mutation-audit-summary
          path: mutation-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify All Mutation Slices Passed
        run: |
          if [ "${{ needs.discover-slices.result }}" != "success" ] || [ "${{ needs.mutation-audit.result }}" != "success" ]; then
            echo "::error::One or more mutation audit slices failed."
            exit 1
          fi
