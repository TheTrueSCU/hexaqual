repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
        exclude: uv\.lock$
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: hexaqual-sanity
        name: hexaqual sanity check
        entry: uv run hexaqual sanity -a --skip-tests --skip-diagrams
        language: system
        pass_filenames: false
      - id: hexaqual-pre-push
        name: hexaqual pre-push sanity gate
        entry: uv run hexaqual sanity -a --skip-tests --skip-diagrams
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: hexaqual-pre-push-tests
        name: hexaqual pre-push affected unit tests
        entry: uv run hexaqual test run -A -U -n auto
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
