repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: uv\.lock$
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false

      - id: check-all-statements
        name: __all__ integrity (check-all-statements)
        entry: uv run check-all-statements
        language: system
        types: [python]
        pass_filenames: false

      - id: check-test-parity
        name: test symmetry (check-test-parity)
        entry: uv run check-test-parity
        language: system
        pass_filenames: false

      - id: complexipy-run
        name: cognitive complexity (complexipy-run)
        entry: uv run complexipy-run src --max-complexity-allowed 25
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: hexagonal layer boundaries (lint-imports)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
